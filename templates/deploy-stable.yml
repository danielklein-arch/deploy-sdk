name: Deploy Stable

# Stala prostredi: push do dev/staging/prod vetve → deploy toho env (STABLE_ENV=branch;
# branch→env mapping resi deploy-sdk pres EnvConfig.branch, napr. branch `prod` → env `production`).
# PERSISTENTNI — zadny cleanup. CI gate je embednuta (ci.yml at bezi jen na PR → zadna duplicita):
# ci + (glue) → provision → migrate → deploy(SKIP_MIGRATIONS) → smoke.
# Prizpusob: branches, ci gate (ci-sdk repo ref), ENVIRONMENT_EXPECTED mapping, bun-version.
on:
  push:
    branches: [dev, staging, prod]

# dev: novy push zrusi rozjety deploy (rychla iterace). staging/prod: NIKDY nerusit mid-deploy
# (zruseny matrix beh = pulka workeru stara, pulka nova) → radi se do fronty.
concurrency:
  group: stable-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name == 'dev' }}

jobs:
  # Quality gate — reusable ci-sdk (affected typecheck/lint/test). Deploy NEZACNE bez zelene CI.
  ci:
    uses: danielklein-arch/ci-sdk/.github/workflows/ci.yaml@v1
    permissions:
      contents: read
      actions: read # nx-set-shas na push eventech potrebuje Actions API
    with:
      affected: true
      skip-build: true # build delaji deploy joby (deploy-sdk build hook)
      bun-version: 1.3.12
    secrets: inherit

  provision:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ids: ${{ steps.p.outputs.ids }}
      matrix: ${{ steps.p.outputs.matrix }}
      entrypoint: ${{ steps.p.outputs.entrypoint }}
      entrypointUrl: ${{ steps.p.outputs.entrypointUrl }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STABLE_ENV: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - id: p
        run: bunx deploy-sdk provision

  # Explicitni pre-deploy migrace (serialne). Fail = deploy se vubec nespusti →
  # zadny half-migrated + half-deployed stav. Vyzaduje additive (expand/contract) migrace.
  migrate:
    needs: provision
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STABLE_ENV: ${{ github.ref_name }}
      PREVIEW_IDS: ${{ needs.provision.outputs.ids }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bunx deploy-sdk migrate

  deploy:
    needs: [provision, migrate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJson(needs.provision.outputs.matrix) }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STABLE_ENV: ${{ github.ref_name }}
      PREVIEW_IDS: ${{ needs.provision.outputs.ids }}
      WORKER: ${{ matrix.worker }}
      SKIP_MIGRATIONS: '1' # migrace probehly v migrate jobu
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bunx deploy-sdk deploy
      - uses: actions/upload-artifact@v7
        with:
          name: url-${{ matrix.worker }}
          path: .preview/url-${{ matrix.worker }}.txt
          if-no-files-found: error

  smoke:
    needs: [provision, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: url-*
          path: urls
          merge-multiple: true
      - id: urls
        env:
          ENTRYPOINT: ${{ needs.provision.outputs.entrypoint }}
          ENTRYPOINT_URL_DET: ${{ needs.provision.outputs.entrypointUrl }}
        run: |
          json='{}'
          for f in urls/url-*.txt; do
            base=$(basename "$f" .txt); base=${base#url-}
            json=$(printf '%s' "$json" | jq --arg b "$base" --arg u "$(cat "$f")" '. + {($b): $u}')
          done
          ep="$ENTRYPOINT_URL_DET"
          [ -z "$ep" ] && ep=$(cat "urls/url-${ENTRYPOINT}.txt")
          {
            echo "worker_urls=$(printf '%s' "$json" | jq -c .)"
            echo "entrypoint_url=$ep"
          } >> "$GITHUB_OUTPUT"
      - name: Smoke check (consumer-provided)
        env:
          ENTRYPOINT_URL: ${{ steps.urls.outputs.entrypoint_url }}
          WORKER_URLS: ${{ steps.urls.outputs.worker_urls }}
          # ENVIRONMENT var je env KEY (branch prod → production), ne branch name — uprav dle topology
          ENVIRONMENT_EXPECTED: ${{ github.ref_name == 'prod' && 'production' || github.ref_name }}
        run: bash "${SMOKE_SCRIPT:-scripts/smoke.sh}"
