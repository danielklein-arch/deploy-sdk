name: Deploy Stable
# Tenky wrapper — logika zije v reusable workflow deploy-sdk repa. CI gate = consumer
# concern (ci-sdk job + needs). Branch→env mapping resi topology.ts (EnvConfig.branch).
on:
  push:
    branches: [dev, staging, prod]

# dev: novy push zrusi rozjety deploy. staging/prod: nikdy nerusit mid-deploy → fronta.
concurrency:
  group: stable-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name == 'dev' }}

jobs:
  ci:
    uses: danielklein-arch/ci-sdk/.github/workflows/ci.yaml@v1
    permissions:
      contents: read
      actions: read # nx-set-shas na push eventech potrebuje Actions API
    with:
      affected: true
    secrets: inherit

  deploy:
    needs: ci
    uses: danielklein-arch/deploy-sdk/.github/workflows/deploy-stable.yaml@v1
    permissions:
      contents: read
    secrets: inherit
    # with:
    #   env-passthrough: MY_SECRET_VAR1,MY_SECRET_VAR2
    #   skip-migrate: true   # projekt bez D1
