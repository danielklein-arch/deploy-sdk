name: PR Preview
# Tenky wrapper — logika zije v reusable workflow deploy-sdk repa.
# Prizpusob: trigger branches, env-passthrough (CSV GH secrets pro topology vars),
# pripadne smoke-script / bun-version.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches: [dev]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    uses: danielklein-arch/deploy-sdk/.github/workflows/preview.yaml@v1
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
    # with:
    #   env-passthrough: MY_SECRET_VAR1,MY_SECRET_VAR2
    #   smoke-script: scripts/smoke.sh
    #   bun-version: latest
