name: GC Previews

# Orphan GC: smaze per-PR zdroje ZAVRENYCH PR (close-cleanup se nespustil / smazana branch / zavod).
# Otevrene PR se NIKDY nemazou (zadny TTL/auto-teardown).
# Tydenni cron = APPLY (close-event cleanup neni spolehlivy sam o sobe → orphany by se hromadily).
# Manualni dispatch = default DRY-RUN; realne mazani: Run workflow → zaskrtni "apply".
on:
  schedule:
    - cron: '0 3 * * 1' # pondeli 03:00 UTC
  workflow_dispatch:
    inputs:
      apply:
        description: Realne mazat (jinak dry-run)
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gc-previews
  cancel-in-progress: false

jobs:
  gc:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      # cron = vzdy apply; dispatch = podle checkboxu
      GC_APPLY: ${{ (github.event_name == 'schedule' || inputs.apply) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # package je gh-free → cisla otevrenych PR dodame z gh pres --open-prs
      - run: |
          OPEN=$(gh pr list --state open --json number --jq '[.[].number] | join(",")')
          bunx deploy-sdk gc --open-prs "$OPEN"
